services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: streamforge-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${STREAMFORGE_SQL_PASSWORD:-StreamForge_dev_12345}"
    ports:
      - "14333:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  redis:
    image: redis:7-alpine
    container_name: streamforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  sqlserver-data:
  redis-data:
